
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qadri Pro | Hacker Lab</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #020604;
    color: #00ff66;
    font-family: Consolas, monospace;
    overflow-x: hidden;
}

#matrix {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.45;
}

.container {
    position: relative;
    z-index: 1;
    width: min(600px, 92%);
    margin: 60px auto;
    padding: 30px;
    background: rgba(0, 8, 4, 0.88);
    border: 1px solid #00ff66;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
    text-align: center;
}

h1 {
    font-size: clamp(2rem, 8vw, 3.5rem);
    margin: 0 0 10px;
    text-shadow: 0 0 15px #00ff66;
}

.subtitle {
    color: #9affbd;
    margin-bottom: 30px;
}

.menu {
    display: grid;
    gap: 12px;
}

.menu button {
    width: 100%;
    padding: 14px;
    color: #00ff66;
    background: rgba(0, 255, 102, 0.05);
    border: 1px solid #00ff66;
    border-radius: 6px;
    font: inherit;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.2s;
}

.menu button:hover,
.menu button:focus-visible {
    background: #00ff66;
    color: #001b0a;
    box-shadow: 0 0 18px #00ff66;
    outline: none;
}

#output {
    min-height: 90px;
    margin-top: 24px;
    padding: 15px;
    border: 1px dashed #168d48;
    color: #b6ffca;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.7;
}

footer {
    margin-top: 25px;
    font-size: 0.8rem;
    color: #64c98a;
}

@media (max-width: 480px) {
    .container {
        margin: 24px auto;
        padding: 20px;
    }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<main class="container">
    <h1>QADRI PRO</h1>
    <p class="subtitle">PERSONAL TERMINAL // ONLINE</p>

    <div class="menu">
        <button onclick="runTool(1)">[1] System Information</button>
        <button onclick="runTool(2)">[2] Network Learning</button>
        <button onclick="runTool(3)">[3] Random Number</button>
        <button onclick="runTool(4)">[4] Change Theme</button>
        <button onclick="runTool(5)">[5] About Qadri Pro</button>
        <button onclick="runTool(6)">[6] Clear Output</button>
    </div>

    <div id="output">SYSTEM READY...
Choose an option above to begin.</div>

    <footer>
        &gt; ALWAYS LEARNING // ALWAYS BUILDING // CURIOUS HACKER
    </footer>
</main>

<script>
// MATRIX BACKGROUND
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&";
const fontSize = 16;
let columns = 0;
let drops = [];

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    columns = Math.ceil(window.innerWidth / fontSize);
    drops = Array.from(
        { length: columns },
        () => Math.random() * -50
    );
}

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.fillStyle = "#00ff66";
    ctx.font = fontSize + "px Consolas, monospace";

    for (let i = 0; i < drops.length; i++) {
        const char = letters[
            Math.floor(Math.random() * letters.length)
        ];

        ctx.fillText(char, i * fontSize, drops[i] * fontSize);

        if (
            drops[i] * fontSize > window.innerHeight &&
            Math.random() > 0.975
        ) {
            drops[i] = 0;
        }

        drops[i]++;
    }

    requestAnimationFrame(drawMatrix);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
drawMatrix();

// INTERACTIVE MENU
const output = document.getElementById("output");

function runTool(option) {
    switch (option) {
        case 1:
            output.textContent =
                "SYSTEM INFORMATION\n" +
                "Browser: " + navigator.userAgent +
                "\nScreen: " + screen.width + " x " + screen.height +
                "\nPlatform: " + navigator.platform;
            break;

        case 2:
            output.textContent =
                "NETWORK LEARNING\n" +
                "This interface does not scan your network.\n" +
                "Open CMD and try: ipconfig\n" +
                "This displays your Windows network settings.";
            break;

        case 3:
            output.textContent =
                "RANDOM NUMBER GENERATED: " +
                Math.floor(Math.random() * 10000);
            break;

        case 4:
            document.body.style.background =
                document.body.style.background === "rgb(0, 0, 25)"
                    ? "#020604"
                    : "#000019";

            output.textContent = "THEME UPDATED.";
            break;

        case 5:
            output.textContent =
                "QADRI PRO v1.0\n" +
                "A personal coding and learning lab.\n" +
                "Built with HTML, CSS and JavaScript.";
            break;

        case 6:
            output.textContent = "OUTPUT CLEARED.\nSYSTEM READY LOADING 86%.....";
            break;
    }
}
</script>

</body>
</html>
